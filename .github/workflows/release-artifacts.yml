name: Release Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: view-as-ai-darwin-arm64
          - runner: macos-15-intel
            asset: view-as-ai-darwin-x64
          - runner: ubuntu-24.04-arm
            asset: view-as-ai-linux-arm64
          - runner: ubuntu-24.04
            asset: view-as-ai-linux-x64
          - runner: windows-11-arm
            asset: view-as-ai-windows-arm64.exe
          - runner: windows-2025
            asset: view-as-ai-windows-x64.exe

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate Unix launcher syntax
        if: runner.os != 'Windows'
        run: sh -n run.sh install.sh
      - name: Validate PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/run.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Install build dependencies
        run: python -m pip install . "pyinstaller==6.22.3"
      - name: Build standalone executable
        run: python scripts/build_binary.py --output "release/${{ matrix.asset }}"
      - name: Smoke-test executable
        run: python scripts/smoke_binary.py "release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: view-as-ai-*
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum view-as-ai-* > checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: release/checksums.txt
          if-no-files-found: error
          retention-days: 7
